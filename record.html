<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎙 録音</title>
<!--
  りしんカルテ 録音ページ
    Google Apps Script の iframe ではマイク(getUserMedia)が使えないため、
    このページをポップアップで開いて録音し、音声チャンクを postMessage で
    呼び出し元(カルテ画面)へ返す。アップロードと患者への紐づけは
    カルテ画面側が行う(このページは患者情報を一切受け取らない・保持しない)。

  ⚠ このリポジトリは公開。患者情報・APIキー・スプレッドシートIDを書かないこと。
  ⚠ 音声チャンクは「この端末の IndexedDB」に一時退避し、親ウィンドウへ渡すだけ。
     患者情報は保存しない。ack が返ったチャンクは即消す。サーバへは一切送らない。

  ── 音声を失わないための設計(案A) ──
    ・録音チャンクを IndexedDB に退避する(メモリだけだと閉じると消えるため)
    ・親(カルテ画面)が閉じても、このウィンドウにデータは残る
    ・親を開き直したら、親から届く rkrec-init(再接続)で送信先を張り替えて自動再送
    ・手動の「もう一度送信する」ボタンでも送れる
    ・ack が返ったチャンクは IndexedDB から消す(溜め続けない)

  ── 🎙 1026recsplit(2026-10-26): 切り替えても止めずに区切る・無音で自動停止・待機 ──
    ・カルテ画面から rkrec-split が来たら、録音は止めずに「区切りの時刻」を決めて返す
      (切り替えの前 3分以内で一番近い「話が途切れた所(静けさ)」。無ければ 1分前。数字は init で変えられる)
      ※ 区切りの時刻だけを返す。音声を分けるのはカルテ画面側(サーバ)
    ・音のない状態が 5分(init で変えられる)続いたら自動で止めて保存し、マイクは開いたまま「待機」する
      (話し始めたら rkrec-voice をカルテ画面へ送り、カルテ画面の指示(rkrec-start)で新しい録音を始める)
    ・90分(init で変えられる)で止めて保存し、待機する(続きはカルテ画面の指示で新しい録音)
    ・静けさの判定は音声処理ノード(ScriptProcessor)で行う(ウィンドウが隠れていても動く。rAF は止まるため)
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif;
    background: #1c1e26; color: #f2f3f7; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px; text-align: center;
  }
  .wrap { width: 100%; max-width: 360px; }
  h1 { font-size: 18px; font-weight: 700; margin-bottom: 18px; }
  .state { font-size: 16px; margin-bottom: 6px; min-height: 24px; }
  .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #666; margin-right: 8px; vertical-align: 1px; }
  .dot.rec { background: #e5484d; animation: blink 1.2s infinite; }
  .dot.idle { background: #f5a623; }
  @keyframes blink { 50% { opacity: .25; } }
  .time { font-size: 48px; font-weight: 700; font-variant-numeric: tabular-nums; margin: 6px 0 18px; }
  button {
    width: 100%; padding: 14px; font-size: 17px; font-weight: 700; border: none; border-radius: 10px;
    background: #e5484d; color: #fff; cursor: pointer; margin-top: 8px;
  }
  button:disabled { background: #555; cursor: default; }
  button.secondary { background: #3a3d4a; }
  .sub { font-size: 13px; color: #9aa0b0; margin-top: 14px; line-height: 1.6; }
  .warn { display: none; margin-top: 12px; padding: 10px 12px; border-radius: 8px;
    background: #3b2f12; color: #ffd98a; font-size: 14px; line-height: 1.6; }
  .err { display: none; margin-top: 12px; padding: 10px 12px; border-radius: 8px;
    background: #3b1a1c; color: #ffb3b6; font-size: 14px; line-height: 1.6; }
  .idle { display: none; margin-top: 12px; padding: 10px 12px; border-radius: 8px;
    background: #2a2f1a; color: #d6e9a3; font-size: 14px; line-height: 1.6; }
  .meter { height: 14px; border-radius: 8px; background: #2a2d38; overflow: hidden; margin: 2px auto 4px; width: 100%; max-width: 320px; }
  .meter-fill { height: 100%; width: 0%; background: #2f9e44; border-radius: 8px; transition: width .07s linear, background .2s; }
  .meter-label { font-size: 12px; color: #9aa0b0; }
  .mic-name { font-size: 12px; color: #9aa0b0; margin-bottom: 8px; min-height: 16px; }
  .quiet { font-size: 12px; color: #9aa0b0; min-height: 16px; }
  .silence { display: none; margin-top: 12px; padding: 10px 12px; border-radius: 8px;
    background: #4a2a12; color: #ffb673; font-size: 15px; line-height: 1.6; }
  .ver { margin-top: 16px; font-size: 11px; color: #6b7080; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎙 録音</h1>
  <div class="state"><span class="dot" id="dot"></span><span id="stateText">カルテ画面と接続しています...</span></div>
  <div class="time" id="time">0:00</div>
  <!-- 🔴 0906m: 音量メーター（入っているか一目で分かる）＋マイク名＋無音警告 -->
  <div class="meter" id="meter" title="マイクに入っている音の大きさ"><div class="meter-fill" id="meterFill"></div></div>
  <div class="meter-label" id="meterLabel">マイク音量</div>
  <div class="mic-name" id="micName"></div>
  <div class="quiet" id="quietLine"></div>
  <div class="silence" id="silenceBox"></div>
  <div class="idle" id="idleBox"></div>
  <button id="stopBtn" onclick="stopBtnClick()" disabled>■ 停止して保存</button>
  <button id="resendBtn" class="secondary" onclick="manualResend()" style="display:none">🔄 もう一度送信する</button>
  <button id="dlBtn" class="secondary" onclick="downloadLocal()" style="display:none">💾 音声をこの端末に保存</button>
  <div class="warn" id="warnBox"></div>
  <div class="err" id="errBox"></div>
  <div class="sub" id="subText">このウィンドウは録音専用です。閉じずにそのままにしてください。<br>停止するとカルテに自動で保存されます。</div>
  <div class="ver" id="ver"></div>
</div>

<script>
'use strict';

// 🔴 0906m: 版番号（先生が「最新か」を判断できるように画面に出す）
var REC_VERSION = 'v2026-10-26a（切り替えで区切る・無音で自動停止・待機）';

// ============================================================
// 設定(カルテ画面からの init で上書きされる)
// ============================================================
var WARN_SEC = 5100;    // 85分: 停止5分前の警告
var MAX_SEC  = 5400;    // 90分: 自動停止(消し忘れ対策)
// 🎙 1026recsplit
var SILENCE_STOP_SEC   = 600;   // 音のない状態がこの秒数続いたら自動停止(10分。カルテ画面の設定で変わる)
var SPLIT_LOOKBACK_SEC = 180;   // 区切り: 切り替えの何秒前まで「途切れ」を探すか(3分)
var SPLIT_FALLBACK_SEC = 60;    // 区切り: 途切れが無いときは何秒前で区切るか(1分)
var SPLIT_SILENCE_SEC  = 2;     // 区切り: 「途切れ」と見なす静けさの秒数
var IDLE_CLOSE_SEC     = 1800;  // 待機のまま何秒たったらウィンドウを閉じるか(マイクを持ち続けない)
var QUIET_PEAK         = 3;     // 128中心の振れ幅がこの値未満＝静か(0906m の無音警告と同じ)

// ============================================================
// 親ウィンドウ(カルテ画面)との接続
//   ・患者情報は受け取らない(タイマー設定のみ)
//   ・チャンクは {type:'rkrec-chunk'} で送り、ack が返るまで再送する
//   ・親が閉じても IndexedDB にチャンクが残る。親を開き直すと rkrec-init で
//     送信先を張り替えて自動再送する(案A)
// ============================================================
var parentWin    = window.opener || null;
var parentOrigin = '';        // init メッセージの origin で固定する
var connected    = false;

var mediaRecorder = null;
var recStream     = null;
var recMime       = '';
var chunkIndex    = 0;
var pending       = {};       // key -> {base64, index, mime} (ack 待ち。ack が来たら消す)
var sentCount     = 0;
var intentionalStop = false;
var restartCount  = 0;
var recSec        = 0;
var timerId       = null;
var stopped       = false;
var readerBusy    = 0;
var wakeLock      = null;
var parentClosedNotified = false;   // 「親が閉じている」案内を出したか

// 🎙 1026recsplit: 録音の区切り・静けさ・待機
var sessionSerial   = 0;        // このウィンドウで何回目の録音か(IndexedDB の鍵を録音ごとに分ける)
var sessionStartPerf = 0;       // 録音開始時刻(performance.now())。media ms の基準
var segStartMs      = 0;        // いまの区切りの始まり(media ms)
var chunkEndMs      = [];       // index -> その小分けが終わった media ms
var quietSinceMs    = null;     // 静けさが始まった media ms(音が入ると null)
var lastSoundMs     = 0;
var quietSpans      = [];       // 終わった静けさ [{s,e}](SPLIT_SILENCE_SEC 以上のものだけ・直近15分)
var pendingSplit    = null;     // rkrec-split を受けて、小分けの flush 待ち
var stopReason      = '';       // 'manual' | 'parent' | 'silence' | 'max' | 'abnormal'
var stopInfo        = null;
var keepOpenAfterStop = false;  // 止めた後も待機する(マイクを開いたまま)
var idle            = false;    // 待機中(録音していない・マイクは開いている)
var idleReason      = '';
var idleSince       = 0;
var idleTimerId     = null;
var voiceWin        = 0;        // 待機中に「音あり」が続いた回数
var lastVoicePostAt = 0;
var procNode        = null;     // ScriptProcessor(静けさの判定用。隠れていても動く)
var procSrc         = null;
var meterSrc        = null;

function $(id) { return document.getElementById(id); }
function setState(t, rec, cls) {
  $('stateText').textContent = t;
  $('dot').className = 'dot' + (rec ? ' rec' : '') + (cls ? ' ' + cls : '');
}
function showWarn(t) { var b = $('warnBox'); b.textContent = t; b.style.display = 'block'; }
function hideWarn()  { var b = $('warnBox'); b.style.display = 'none'; }
function showErr(t)  { var b = $('errBox');  b.textContent = '⚠ ' + t; b.style.display = 'block'; }
function hideErr()   { var b = $('errBox');  b.style.display = 'none'; }
function showIdle(t) { var b = $('idleBox'); b.textContent = t; b.style.display = t ? 'block' : 'none'; }
function unsentCount() { return Object.keys(pending).length + readerBusy; }
function refreshResendBtn() {
  // 未送信があるときだけ手動再送ボタンを見せる
  $('resendBtn').style.display = (unsentCount() > 0) ? 'block' : 'none';
}
function mediaMs() { return sessionStartPerf ? Math.max(0, Math.round(performance.now() - sessionStartPerf)) : 0; }
function fmtMs(ms) { var s = Math.round(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function isRecording() { return !!(mediaRecorder && mediaRecorder.state === 'recording'); }

// ============================================================
// IndexedDB(音声チャンクの退避先)
//   store 'chunks' keyPath 'index'。中身: {index(=鍵), base64, mime, at, sidx, sid}
//   ★患者情報は入れない。ack が返ったら delete する。
//   🎙 1026recsplit: 鍵は 録音の通し番号×100000 + 小分け番号(待機→再開で小分け番号が 0 に戻るため)
// ============================================================
var DB_NAME = 'rkrec-db', DB_STORE = 'chunks', _db = null;
function dbOpen() {
  return new Promise(function(res) {
    try {
      var r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = function() {
        var db = r.result;
        if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE, { keyPath: 'index' });
      };
      r.onsuccess = function() { _db = r.result; res(_db); };
      r.onerror   = function() { res(null); };   // IndexedDB不可でも録音は続ける(メモリ pending が保険)
    } catch (e) { res(null); }
  });
}
function dbPut(rec) {
  return new Promise(function(res) {
    if (!_db) return res();
    try {
      var tx = _db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).put(rec);
      tx.oncomplete = function() { res(); };
      tx.onerror    = function() { res(); };
    } catch (e) { res(); }
  });
}
function dbDelete(index) {
  return new Promise(function(res) {
    if (!_db) return res();
    try {
      var tx = _db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).delete(index);
      tx.oncomplete = function() { res(); };
      tx.onerror    = function() { res(); };
    } catch (e) { res(); }
  });
}
function dbGetAll() {
  return new Promise(function(res) {
    if (!_db) return res([]);
    try {
      var tx = _db.transaction(DB_STORE, 'readonly');
      var rq = tx.objectStore(DB_STORE).getAll();
      rq.onsuccess = function() { res(rq.result || []); };
      rq.onerror   = function() { res([]); };
    } catch (e) { res([]); }
  });
}

// ---- 接続ハンドシェイク ----
//   ready を親へ送る(データ無し) → 親が init を返す → origin を固定して録音開始
var readyTries = 0;
function sendReady() {
  if (connected) return;
  if (!parentWin || parentWin.closed) {
    setState('接続できません', false);
    showErr('カルテ画面から開かれていません。カルテの 🎙 ボタンから開いてください。');
    return;
  }
  try { parentWin.postMessage({ type: 'rkrec-ready', version: REC_VERSION }, '*'); } catch (e) {}
  readyTries++;
  if (readyTries < 15) setTimeout(sendReady, 1000);
  else if (!connected) {
    setState('接続できません', false);
    showErr('カルテ画面と接続できませんでした。このウィンドウを閉じ、カルテの 🎙 ボタンからもう一度開いてください。');
  }
}

// init / reconnect / start で届く数字を取り込む(無いものは今のまま)
function applyConfig(d) {
  var num = function(v) { return (typeof v === 'number' && isFinite(v) && v > 0) ? v : null; };
  if (num(d.warnSec)) WARN_SEC = d.warnSec;
  if (num(d.maxSec))  MAX_SEC  = d.maxSec;
  if (num(d.silenceStopSec))   SILENCE_STOP_SEC   = d.silenceStopSec;
  if (num(d.splitLookbackSec)) SPLIT_LOOKBACK_SEC = d.splitLookbackSec;
  if (typeof d.splitFallbackSec === 'number' && d.splitFallbackSec >= 0) SPLIT_FALLBACK_SEC = d.splitFallbackSec;
  if (num(d.splitSilenceSec))  SPLIT_SILENCE_SEC  = d.splitSilenceSec;
  if (num(d.idleCloseSec))     IDLE_CLOSE_SEC     = d.idleCloseSec;
  if (num(d.quietPeak))        QUIET_PEAK         = d.quietPeak;
  if (WARN_SEC >= MAX_SEC) WARN_SEC = Math.max(60, MAX_SEC - 300);
}

window.addEventListener('message', function(e) {
  var d = e.data || {};

  // ---- 初回接続前: 開いた元のウィンドウからの init だけ受け付け、origin を固定 ----
  if (!connected) {
    if (e.source !== parentWin) return;
    if (d.type !== 'rkrec-init') return;
    parentOrigin = e.origin;
    connected = true;
    applyConfig(d);
    startRecording();
    return;
  }

  // ---- 接続後 ----
  if (e.origin !== parentOrigin) return;
  if (d.type === 'rkrec-chunk-ack') {
    var key = (d.key !== undefined) ? Number(d.key) : Number(d.index);
    if (pending[key] !== undefined) {
      delete pending[key];
      sentCount++;
      dbDelete(key);   // ★ack が返ったチャンクは退避先からも消す(溜めない)
      refreshResendBtn();
    }
  } else if (d.type === 'rkrec-init' || d.type === 'rkrec-reconnect') {
    // ★親(カルテ画面)を開き直した → 送信元を新しい親として採用し、未送信を再送する
    parentWin = e.source;
    parentClosedNotified = false;
    hideErr();
    applyConfig(d);
    if (unsentCount() > 0) {
      showWarn('カルテ画面と再接続しました。未送信の音声を送っています...');
      resendPending();
    } else {
      hideWarn();
    }
  } else if (d.type === 'rkrec-stop') {
    // 🎙 1026recsplit: keepOpen=true なら止めた後も待機(マイクを開いたまま)
    keepOpenAfterStop = !!d.keepOpen;
    requestStop('カルテ画面からの停止', 'parent');
  } else if (d.type === 'rkrec-split') {
    doSplit(d);                      // 🎙 1026recsplit: 止めずに区切る
  } else if (d.type === 'rkrec-start') {
    startSession(d);                 // 🎙 1026recsplit: 待機中に新しい録音を始める
  } else if (d.type === 'rkrec-seg-done') {
    // 🎙 1026recsplit: 区切りの保存の結果(録音は続いている・待機中)。一言だけ出す
    if (d.ok) { showIdleNote('前の分を保存しました ✅'); }
    else { showWarn('前の分の保存に失敗しました: ' + (d.error || '') + ' / カルテ画面で「もう一度」を押してください。'); }
  } else if (d.type === 'rkrec-done') {
    if (d.ok) {
      if (d.keepOpen && idle) { showIdleNote('保存しました ✅'); return; }
      setState('保存しました ✅', false);
      $('subText').textContent = 'このウィンドウは自動で閉じます。';
      releaseStream();
      setTimeout(function() { window.close(); }, 1500);
    } else {
      setState('保存エラー', false);
      showErr('カルテ側の保存に失敗しました: ' + (d.error || '') + ' / 録音は残っています。カルテ画面を確認してください。');
    }
  } else if (d.type === 'rkrec-close') {
    releaseStream();
    setTimeout(function() { window.close(); }, 300);
  }
});

function post(msg) {
  if (!parentWin || parentWin.closed || !parentOrigin) return false;
  try { parentWin.postMessage(msg, parentOrigin); return true; } catch (e) { return false; }
}

// 未送信(pending)を全部もう一度送る
function resendPending() {
  Object.keys(pending).forEach(function(k) {
    var p = pending[k];
    post({ type: 'rkrec-chunk', index: p.index, key: Number(k), sid: p.sid || '', base64: p.base64, mime: p.mime || recMime });
  });
}

// 手動の「もう一度送信する」
function manualResend() {
  if (!parentWin || parentWin.closed || !parentOrigin) {
    showWarn('カルテ画面(🎙 を開いたタブ)が見つかりません。そのタブを表に出すと自動で送信されます。'
           + 'タブを閉じてしまった場合は「💾 音声をこの端末に保存」で手元に残し、カルテに手動で添付してください。');
    $('dlBtn').style.display = 'block';
    return;
  }
  if (unsentCount() === 0) { hideWarn(); return; }
  setState('未送信の音声を送っています...', false);
  resendPending();
}

// ---- 最終保険: 未送信の音声をこの端末にダウンロードして手元に残す ----
//   カルテ画面のタブ自体を閉じてしまい postMessage で送れないときの救済。
//   「戻せません」で終わらせないための出口(音声そのものは必ず手元に残せる)。
function downloadLocal() {
  dbGetAll().then(function(rows) {
    if (!rows || !rows.length) {
      rows = Object.keys(pending).map(function(k) {
        return { index: Number(k), base64: pending[k].base64, mime: pending[k].mime };
      });
    }
    if (!rows.length) { showWarn('保存できる未送信の音声はありません。'); return; }
    rows.sort(function(a, b) { return a.index - b.index; });
    var mime = rows[0].mime || recMime || 'audio/webm';
    var blobParts = rows.map(function(r) {
      var bin = atob(r.base64 || '');
      var arr = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return arr;
    });
    var blob = new Blob(blobParts, { type: mime });
    var ext = (mime.indexOf('ogg') >= 0) ? 'ogg' : 'webm';
    var now = new Date();
    var ts = now.getFullYear() + String(now.getMonth() + 1).padStart(2, '0') + String(now.getDate()).padStart(2, '0')
           + '_' + String(now.getHours()).padStart(2, '0') + String(now.getMinutes()).padStart(2, '0');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'rec_' + ts + '.' + ext;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    showWarn('音声をこの端末にダウンロードしました（rec_' + ts + '.' + ext + '）。'
           + 'カルテの患者を開き、添付から手動で取り込んでください。');
  });
}

// ---- ack が返らないチャンクの再送(届くまで5秒ごと)。親が閉じていたら案内を出す ----
setInterval(function() {
  if (!connected) return;
  refreshResendBtn();
  var keys = Object.keys(pending);
  if (!keys.length) { if (parentClosedNotified) { parentClosedNotified = false; } return; }
  if (!parentWin || parentWin.closed || !parentOrigin) {
    // ★「戻せません」とは言わない。データは残っており、開き直せば送れることを明確に伝える
    if (!parentClosedNotified) {
      parentClosedNotified = true;
      setState('カルテ画面が閉じています', false);
      showWarn('カルテ画面が見つかりません。録音はこのウィンドウに保存されています（未送信 ' + keys.length + ' 分）。'
             + 'カルテ画面のタブを表に出す（または開き直す）と自動で送信されます。🔴 このウィンドウは閉じないでください。'
             + 'すぐ手元に残したいときは「💾 音声をこの端末に保存」を押してください。');
      $('resendBtn').style.display = 'block';
      $('dlBtn').style.display = 'block';
    }
    return;
  }
  resendPending();
}, 5000);

// ============================================================
// 🔴 0906m: 音量メーター / マイク名 / 無音警告
//   ⚠ すべて best-effort。AudioContext が使えない・失敗しても録音は絶対に止めない。
// 🎙 1026recsplit: 静けさの判定は ScriptProcessor(音声スレッド駆動)で行う。
//   rAF はウィンドウが隠れると止まるが、こちらは止まらない。失敗したら1秒タイマーで代用する
// ============================================================
var audioCtx = null, analyser = null, meterRAF = null, meterData = null;
var lastSoundAt = 0, silenceShown = false;
var SILENCE_MS = 10000;   // 10秒 連続で無音なら警告
var SILENCE_PEAK = 3;     // 128中心の振れ幅がこの値未満＝ほぼ無音
var procOk = false;

function showMicName(stream) {
  var label = '';
  try { var tr = stream.getAudioTracks && stream.getAudioTracks()[0]; if (tr) label = tr.label || ''; } catch (e) {}
  $('micName').textContent = label ? ('マイク: ' + label) : 'マイク: （名称を取得できませんでした）';
}

function attachMeter(stream) {
  stopMeter();
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { $('meterLabel').textContent = '音量メーター（この端末では表示できません）'; return; }
    audioCtx = new AC();
    if (audioCtx.state === 'suspended') { try { audioCtx.resume(); } catch (e) {} }
    meterSrc = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    meterSrc.connect(analyser);
    meterData = new Uint8Array(analyser.fftSize);
    lastSoundAt = Date.now(); silenceShown = false;
    $('silenceBox').style.display = 'none';
    loopMeter();
    // 🎙 1026recsplit: 静けさの判定(約85msごと。隠れていても動く)
    try {
      procNode = audioCtx.createScriptProcessor(4096, 1, 1);
      procNode.onaudioprocess = function(ev) {
        try {
          var ch = ev.inputBuffer.getChannelData(0), pk = 0;
          for (var i = 0; i < ch.length; i += 2) { var v = Math.abs(ch[i]); if (v > pk) pk = v; }
          onQuietSample(pk * 128);
        } catch (e2) {}
      };
      meterSrc.connect(procNode);
      procNode.connect(audioCtx.destination);   // 出力につながないと動かないブラウザがある(無音の経路)
      procOk = true;
    } catch (eP) { procOk = false; }
  } catch (e) {
    $('meterLabel').textContent = '音量メーター（表示できませんでした）';
  }
}

function loopMeter() {
  if (!analyser) return;
  try {
    analyser.getByteTimeDomainData(meterData);
    var peak = 0;
    for (var i = 0; i < meterData.length; i++) { var dv = Math.abs(meterData[i] - 128); if (dv > peak) peak = dv; }
    var pct = Math.min(100, Math.round(peak / 128 * 160));   // ★1.6倍で見やすく
    var fill = $('meterFill');
    if (fill) {
      fill.style.width = pct + '%';
      fill.style.background = pct > 75 ? '#e5484d' : (pct > 40 ? '#f5a623' : '#2f9e44');
    }
    // 無音判定（録音中のみ）
    var recording = isRecording();
    if (peak >= SILENCE_PEAK) {
      lastSoundAt = Date.now();
      if (silenceShown) { silenceShown = false; $('silenceBox').style.display = 'none'; }
    } else if (recording && (Date.now() - lastSoundAt) > SILENCE_MS && !silenceShown) {
      silenceShown = true;
      $('silenceBox').textContent = '🔇 音がほとんど入っていません。マイクの位置・ミュート・入力デバイスをご確認ください（録音は続いています）。';
      $('silenceBox').style.display = 'block';
    }
    if (!procOk) onQuietSample(peak);   // ScriptProcessor が使えないときの代用(表示中だけ)
  } catch (e) {}
  meterRAF = requestAnimationFrame(loopMeter);
}

function stopMeter() {
  if (meterRAF) { cancelAnimationFrame(meterRAF); meterRAF = null; }
  try { if (procNode) { procNode.disconnect(); procNode.onaudioprocess = null; } } catch (e0) {}
  try { if (meterSrc) meterSrc.disconnect(); } catch (e1) {}
  try { if (audioCtx) audioCtx.close(); } catch (e) {}
  audioCtx = null; analyser = null; procNode = null; meterSrc = null; procOk = false;
  var fill = $('meterFill'); if (fill) fill.style.width = '0%';
  var sb = $('silenceBox'); if (sb) sb.style.display = 'none';
}

// ============================================================
// 🎙 1026recsplit: 静けさの追跡(media ms 基準)・無音で自動停止・待機中の声の検知
// ============================================================
function onQuietSample(peak) {
  var now = mediaMs();
  if (peak >= QUIET_PEAK) {
    if (quietSinceMs !== null) {
      if (now - quietSinceMs >= SPLIT_SILENCE_SEC * 1000) {
        quietSpans.push({ s: quietSinceMs, e: now });
        var keepFrom = now - 15 * 60 * 1000;
        while (quietSpans.length && quietSpans[0].e < keepFrom) quietSpans.shift();
      }
      quietSinceMs = null;
    }
    lastSoundMs = now;
    if (idle) {
      voiceWin++;
      if (voiceWin >= 8 && Date.now() - lastVoicePostAt > 10000) {   // 約0.7秒以上「音あり」が続いた
        lastVoicePostAt = Date.now();
        post({ type: 'rkrec-voice', reason: idleReason, idleSec: Math.round((Date.now() - idleSince) / 1000) });
      }
    }
  } else {
    if (quietSinceMs === null) quietSinceMs = now;
    if (idle) voiceWin = 0;
    // 無音で自動停止(録音中だけ)
    if (isRecording() && !intentionalStop && SILENCE_STOP_SEC > 0 && now - quietSinceMs >= SILENCE_STOP_SEC * 1000) {
      stopInfo = { silenceStartMs: quietSinceMs, quietSec: Math.round((now - quietSinceMs) / 1000) };
      showWarn('🔇 音のない状態が ' + Math.round(SILENCE_STOP_SEC / 60) + ' 分続いたため、録音を止めて保存します（話し始めると再開します）');
      keepOpenAfterStop = true;
      requestStop('無音の自動停止', 'silence');
    }
  }
  var ql = $('quietLine');
  if (ql && isRecording()) {
    var q = (quietSinceMs !== null) ? (now - quietSinceMs) : 0;
    ql.textContent = q >= 3000 ? ('静か: ' + Math.round(q / 1000) + '秒（' + Math.round(SILENCE_STOP_SEC / 60) + '分続くと自動で止めます）') : '';
  }
}

// ---- 区切り(止めずに) ----
//   区切りの時刻 = 切り替えの前 SPLIT_LOOKBACK_SEC 以内で一番近い「静けさ」(SPLIT_SILENCE_SEC 以上)。
//     ・いま静けさの最中なら、その静けさの始まり(+0.5秒)
//     ・10秒以上の静けさ(患者さんの入れ替わりらしい)があればその最新を優先、無ければ最新の静けさ
//     ・無ければ SPLIT_FALLBACK_SEC 前
//   区切りは今の区切りの始まりより前には戻らない。区切ったら小分けを flush(requestData)して、
//   その小分けの番号と一緒にカルテ画面へ返す(音声を分けるのはカルテ画面側)
function doSplit(d) {
  var now = mediaMs();
  if (!isRecording() || !sessionStartPerf) {
    post({ type: 'rkrec-split-at', reqId: d.reqId, ok: false, error: '録音していません' });
    return;
  }
  if (pendingSplit) { post({ type: 'rkrec-split-at', reqId: d.reqId, ok: false, error: '前の区切りを処理中です' }); return; }
  var lookback = now - SPLIT_LOOKBACK_SEC * 1000;
  var minMs = segStartMs + 1000;
  var pick = null, reason = '', sil = null;
  if (quietSinceMs !== null && now - quietSinceMs >= SPLIT_SILENCE_SEC * 1000 && quietSinceMs >= Math.max(lookback, minMs)) {
    pick = quietSinceMs + 500;
    sil = { s: quietSinceMs, e: now };
    reason = 'いま静か（' + ((now - quietSinceMs) / 1000).toFixed(1) + '秒）';
  } else {
    var cands = quietSpans.filter(function(sp) { return sp.e >= lookback && sp.s >= minMs; });
    var longs = cands.filter(function(sp) { return sp.e - sp.s >= 10000; });
    var sp = (longs.length ? longs : cands).slice(-1)[0];
    if (sp) {
      pick = sp.s + Math.min(1000, Math.round((sp.e - sp.s) / 2));
      sil = sp;
      reason = '話が途切れた所（' + ((sp.e - sp.s) / 1000).toFixed(1) + '秒の静けさ・切り替えの' + fmtMs(now - sp.s) + '前）';
    }
  }
  if (pick === null) {
    pick = Math.max(minMs, now - SPLIT_FALLBACK_SEC * 1000);
    reason = '途切れが見つからず、切り替えの' + fmtMs(now - pick) + '前';
  }
  if (pick > now) pick = now;
  pendingSplit = { reqId: d.reqId, splitMs: pick, prevStartMs: segStartMs, nowMs: now, reason: reason,
                   silenceSec: sil ? Math.round((sil.e - sil.s) / 100) / 10 : 0, flushIndex: -1 };
  segStartMs = pick;
  try { mediaRecorder.requestData(); } catch (e) { sendSplitReply(chunkIndex - 1); }
}

function sendSplitReply(flushIdx) {
  var ps = pendingSplit; if (!ps) return;
  pendingSplit = null;
  // 区切りの時刻を含む小分けの番号(その小分けの終わりが区切りの時刻以上の最初のもの)
  var splitIndex = flushIdx;
  for (var i = 0; i < chunkEndMs.length; i++) { if (chunkEndMs[i] !== undefined && chunkEndMs[i] >= ps.splitMs) { splitIndex = i; break; } }
  post({ type: 'rkrec-split-at', reqId: ps.reqId, ok: true, splitMs: ps.splitMs, prevStartMs: ps.prevStartMs, nowMs: ps.nowMs,
         flushIndex: flushIdx, splitIndex: splitIndex, reason: ps.reason, silenceSec: ps.silenceSec, chunkCount: chunkIndex });
  showIdleNote('区切りました（' + ps.reason + '）。録音は続いています');
}

var idleNoteTimer = null;
function showIdleNote(t) {
  showIdle(t);
  clearTimeout(idleNoteTimer);
  if (!idle) idleNoteTimer = setTimeout(function() { showIdle(''); }, 6000);
}

// ============================================================
// 録音本体(りしんカルテ v1.22 と同じ設計:
//   24kbpsモノラル / 1分チャンク / 異常停止から最大3回自動復帰 / Wake Lock)
// ============================================================
function startRecording() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setState('録音できません', false);
    showErr('このブラウザは録音に対応していません。');
    return;
  }
  setState('マイクの許可を待っています...', false);
  navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true }
  }).then(function(stream) {
    recStream = stream;
    recMime = (window.MediaRecorder && MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) ? 'audio/webm;codecs=opus'
            : (window.MediaRecorder && MediaRecorder.isTypeSupported('audio/webm'))             ? 'audio/webm'
            : 'audio/ogg';
    beginSession();
    startMediaRecorder(stream);
    startTimer();
    acquireWakeLock();
    showMicName(stream);     // 🔴 0906m
    attachMeter(stream);     // 🔴 0906m
    setState('録音中', true);
    $('stopBtn').disabled = false;
    post({ type: 'rkrec-started', serial: sessionSerial });
  }).catch(function(err) {
    setState('録音できません', false);
    var name = (err && err.name) || '';
    if (name === 'NotAllowedError' || name === 'PermissionDeniedError') {
      showErr('マイクの使用が許可されませんでした。アドレスバーのマイクのアイコン(または鍵マーク)から「許可」にして、ページを再読み込みしてください。');
    } else if (name === 'NotFoundError') {
      showErr('マイクが見つかりません。');
    } else if (name === 'NotReadableError') {
      showErr('マイクが他のアプリに使用中です。');
    } else {
      showErr('マイクエラー: ' + name + ' ' + ((err && err.message) || ''));
    }
  });
}

// 🎙 1026recsplit: 録音1本ぶんの状態を初期化(初回と、待機からの再開の両方)
function beginSession() {
  sessionSerial++;
  sessionStartPerf = performance.now();
  segStartMs = 0;
  chunkEndMs = [];
  chunkIndex = 0;
  quietSinceMs = null; lastSoundMs = 0; quietSpans = [];
  pendingSplit = null;
  recSec = 0;
  restartCount = 0;
  intentionalStop = false;
  stopped = false;
  stopReason = ''; stopInfo = null;
  keepOpenAfterStop = false;
  idle = false; idleReason = ''; voiceWin = 0;
  clearTimeout(idleTimerId); idleTimerId = null;
  showIdle('');
  hideWarn();
  $('time').textContent = '0:00';
  $('stopBtn').textContent = '■ 停止して保存';
  $('subText').innerHTML = 'このウィンドウは録音専用です。閉じずにそのままにしてください。<br>停止するとカルテに自動で保存されます。';
}

// 🎙 1026recsplit: 待機中にカルテ画面から「新しい録音を始めて」と言われた
function startSession(d) {
  if (!idle) { post({ type: 'rkrec-start-result', ok: isRecording(), error: isRecording() ? '' : '待機中ではありません' }); return; }
  if (unsentCount() > 0) { post({ type: 'rkrec-start-result', ok: false, error: '前の録音の未送信が残っています' }); return; }
  applyConfig(d || {});
  var go = function(stream) {
    recStream = stream;
    beginSession();
    startMediaRecorder(stream);
    startTimer();
    acquireWakeLock();
    if (!audioCtx) attachMeter(stream);
    setState('録音中', true);
    $('stopBtn').disabled = false;
    post({ type: 'rkrec-started', serial: sessionSerial });
  };
  var alive = false;
  try { alive = !!(recStream && recStream.getAudioTracks()[0] && recStream.getAudioTracks()[0].readyState === 'live'); } catch (e) {}
  if (alive) { go(recStream); return; }
  // マイクが切れていた(待機中にケーブルが抜けた等) → 開き直す
  setState('マイクを開いています...', false);
  navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } })
    .then(function(stream) { stopMeter(); go(stream); showMicName(stream); attachMeter(stream); })
    .catch(function(err) { post({ type: 'rkrec-start-result', ok: false, error: 'マイクを開けません: ' + ((err && err.name) || '') }); setState('待機中（マイクを開けません）', false, 'idle'); });
}

function startMediaRecorder(stream) {
  try {
    mediaRecorder = new MediaRecorder(stream, { mimeType: recMime, audioBitsPerSecond: 24000 });
  } catch (e) {
    mediaRecorder = new MediaRecorder(stream, { mimeType: recMime });
  }
  mediaRecorder.ondataavailable = function(e) {
    if (e.data && e.data.size > 0) enqueueChunk(e.data);
    else if (pendingSplit) sendSplitReply(chunkIndex - 1);
  };
  mediaRecorder.onstop = function() {
    // 🎙 1026recsplit: 待機するときはマイクを閉じない
    if (!keepOpenAfterStop) { try { if (recStream) recStream.getTracks().forEach(function(t) { t.stop(); }); } catch (e) {} }
    if (intentionalStop) finishAndNotify();
    else handleAbnormalStop();
  };
  mediaRecorder.onerror = function() {
    if (!intentionalStop) handleAbnormalStop();
  };
  stream.getTracks().forEach(function(t) {
    t.onended = function() {
      if (!intentionalStop && mediaRecorder && mediaRecorder.state === 'recording') {
        try { mediaRecorder.stop(); } catch (e) {}
      }
    };
  });
  mediaRecorder.start(60000);   // 1分ごとにチャンク発生
}

function enqueueChunk(blob) {
  var idx = chunkIndex++;
  var key = sessionSerial * 100000 + idx;
  chunkEndMs[idx] = mediaMs();   // 🎙 1026recsplit: この小分けが終わった時刻
  readerBusy++;
  var reader = new FileReader();
  reader.onload = function(e) {
    readerBusy--;
    var base64 = (String(e.target.result).split(',')[1]) || '';
    pending[key] = { base64: base64, index: idx, mime: recMime, sid: '' };
    dbPut({ index: key, base64: base64, mime: recMime, at: Date.now(), sidx: idx, serial: sessionSerial });   // ★退避(閉じても残る)
    post({ type: 'rkrec-chunk', index: idx, key: key, base64: base64, mime: recMime });
    refreshResendBtn();
    if (pendingSplit && pendingSplit.flushIndex < 0) { pendingSplit.flushIndex = idx; sendSplitReply(idx); }
  };
  reader.onerror = function() { readerBusy--; showErr('音声チャンクの読み取りに失敗しました (#' + idx + ')'); if (pendingSplit) sendSplitReply(idx); };
  reader.readAsDataURL(blob);
}

// ---- 異常停止 → 自動復帰(最大3回。チャンク連番は引き継ぐ) ----
function handleAbnormalStop() {
  if (restartCount >= 3) {
    showErr('録音を再開できませんでした。録れた分を保存します。');
    intentionalStop = true;
    stopReason = 'abnormal';
    finishAndNotify();
    return;
  }
  restartCount++;
  setState('録音が中断しました。再開しています... (' + restartCount + '/3)', false);
  navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true }
  }).then(function(stream) {
    recStream = stream;
    startMediaRecorder(stream);
    acquireWakeLock();
    showMicName(stream);     // 🔴 0906m
    attachMeter(stream);     // 🔴 0906m（新しいストリームに張り替え）
    setState('録音中(再開しました)', true);
  }).catch(function() {
    setTimeout(handleAbnormalStop, 1500);
  });
}

// ---- タイマー / 85分警告 / 90分自動停止 ----
function startTimer() {
  if (timerId) clearInterval(timerId);
  timerId = setInterval(function() {
    recSec++;
    var m = Math.floor(recSec / 60);
    var s = String(recSec % 60);
    if (s.length < 2) s = '0' + s;
    $('time').textContent = m + ':' + s;
    post({ type: 'rkrec-tick', sec: recSec, ms: mediaMs(), quietSec: quietSinceMs !== null ? Math.round((mediaMs() - quietSinceMs) / 1000) : 0 });
    if (recSec === WARN_SEC) showWarn('⚠️ あと' + Math.round((MAX_SEC - WARN_SEC) / 60) + '分で自動停止します(' + Math.round(MAX_SEC / 60) + '分の上限)');
    if (recSec >= MAX_SEC && !intentionalStop) {
      // 🎙 1026recsplit: 上限で止めて保存し、待機する(カルテ画面がすぐ新しい録音を始める)
      showWarn('⏹ ' + Math.round(MAX_SEC / 60) + '分たったため、録音を止めて保存します（続きは新しい録音になります）');
      keepOpenAfterStop = true;
      stopInfo = { maxSec: MAX_SEC };
      requestStop(Math.round(MAX_SEC / 60) + '分の自動停止', 'max');
    }
    // ScriptProcessor が止まっている保険: 1秒ごとにメーターの値でも静けさを見る(表示中は rAF が代用済み)
    if (!procOk && analyser && document.visibilityState !== 'visible') {
      try { analyser.getByteTimeDomainData(meterData); var pk = 0; for (var i = 0; i < meterData.length; i++) { var dv = Math.abs(meterData[i] - 128); if (dv > pk) pk = dv; } onQuietSample(pk); } catch (e) {}
    }
  }, 1000);
}

// ---- 停止 → 未送信チャンクを送り切る → カルテ画面へ通知 ----
function stopBtnClick() {
  if (idle) { releaseStream(); post({ type: 'rkrec-idle-closed', reason: 'button' }); window.close(); return; }
  requestStop('手動', 'manual');
}

function requestStop(reason, kind) {
  if (stopped) return;
  intentionalStop = true;
  stopReason = kind || 'manual';
  $('stopBtn').disabled = true;
  setState('停止しています... (' + reason + ')', false);
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();   // 最後の ondataavailable → onstop → finishAndNotify
  } else {
    finishAndNotify();
  }
}

function finishAndNotify() {
  if (stopped) return;
  stopped = true;
  if (timerId) { clearInterval(timerId); timerId = null; }
  releaseWakeLock();
  if (!keepOpenAfterStop) stopMeter();   // 🔴 0906m: メーター停止（AudioContext を閉じる）
  var tries = 0;
  (function waitDrain() {
    var left = unsentCount();
    if (left > 0 && tries < 240) {   // 最大2分待つ(再送は5秒ごとに走っている)
      tries++;
      setState('音声を送信しています... 残り' + left, false);
      setTimeout(waitDrain, 500);
      return;
    }
    if (left > 0) {
      // ★親が閉じていても「戻せません」とは言わない。データは残っており、開き直せば送れる
      stopped = false;                // もう一度停止処理をやり直せるように戻す
      $('stopBtn').disabled = false;
      $('resendBtn').style.display = 'block';
      if (!parentWin || parentWin.closed || !parentOrigin) {
        setState('カルテ画面が閉じています', false);
        $('dlBtn').style.display = 'block';
        showWarn('未送信の音声が' + left + '分あります。カルテ画面のタブを表に出す（または開き直す）と自動で送信されます。'
               + 'タブを閉じてしまった場合は「💾 音声をこの端末に保存」で手元に残し、カルテに手動で添付してください。🔴 このウィンドウは閉じないでください。');
      } else {
        showWarn('未送信の音声が' + left + '分あります。「🔄 もう一度送信する」を押すか、カルテ画面が開いているか確認してください。');
      }
      return;
    }
    post({ type: 'rkrec-stopped', chunkCount: chunkIndex, mime: (recMime.split(';')[0] || 'audio/webm'),
           reason: stopReason, recMs: mediaMs(), segStartMs: segStartMs,
           silenceStartMs: (stopInfo && stopInfo.silenceStartMs !== undefined) ? stopInfo.silenceStartMs : null,
           keepOpen: keepOpenAfterStop });
    if (keepOpenAfterStop) enterIdle(stopReason);
    else {
      setState('カルテに保存しています...', false);
      $('subText').textContent = '保存が終わると自動で閉じます。';
    }
  })();
}

// 🎙 1026recsplit: 待機(録音していない・マイクは開いたまま・話し始めたらカルテ画面に知らせる)
function enterIdle(reason) {
  idle = true;
  idleReason = reason || '';
  idleSince = Date.now();
  voiceWin = 0;
  mediaRecorder = null;
  setState('待機中（録音していません）', false, 'idle');
  $('time').textContent = '0:00';
  $('quietLine').textContent = '';
  $('stopBtn').disabled = false;
  $('stopBtn').textContent = '✕ 閉じる';
  var msg = (reason === 'silence') ? '🔇 無音が続いたので録音を止めました（保存しています）。話し始めると自動で再開します。'
          : (reason === 'max')     ? '⏹ 上限の時間になったので録音を止めました（保存しています）。続きは新しい録音で自動で始まります。'
          : '保存しています。次の患者さんを開くか、カルテに文字を入れると録音を始めます。';
  showIdle(msg);
  $('subText').textContent = 'このウィンドウは待機中です。閉じずにそのままにしておくと、次の録音がすぐ始まります（' + Math.round(IDLE_CLOSE_SEC / 60) + '分たつと自動で閉じます）。';
  clearTimeout(idleTimerId);
  idleTimerId = setTimeout(function() {
    if (!idle) return;
    post({ type: 'rkrec-idle-closed', reason: 'timeout' });
    releaseStream();
    window.close();
  }, IDLE_CLOSE_SEC * 1000);
}

function releaseStream() {
  stopMeter();
  try { if (recStream) recStream.getTracks().forEach(function(t) { t.stop(); }); } catch (e) {}
  recStream = null;
  idle = false;
  clearTimeout(idleTimerId); idleTimerId = null;
}

// ---- Wake Lock(画面スリープ抑止) ----
function acquireWakeLock() {
  try {
    if (!navigator.wakeLock) return;
    navigator.wakeLock.request('screen').then(function(wl) {
      wakeLock = wl;
      wl.addEventListener('release', function() { wakeLock = null; });
    }).catch(function() {});
  } catch (e) {}
}
function releaseWakeLock() {
  try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) {}
}
document.addEventListener('visibilitychange', function() {
  if (document.visibilityState === 'visible' && isRecording()) acquireWakeLock();
});

// ---- 閉じる前の警告(録音中・未送信データがあるとき) ----
window.addEventListener('beforeunload', function(e) {
  if (isRecording() || unsentCount() > 0) {
    e.preventDefault();
    e.returnValue = '録音中または未送信の音声があります。閉じますか？';
    return e.returnValue;
  }
});
window.addEventListener('pagehide', function() { try { if (idle) post({ type: 'rkrec-idle-closed', reason: 'unload' }); } catch (e) {} });

// ============================================================
// 起動: IndexedDB を開く → 前回の未送信チャンクが残っていれば復元して知らせる
//   (ウィンドウがクラッシュ等で一度閉じても、開き直せば送れるようにする保険)
// ============================================================
// 🔴 0906m: 版番号を表示（先生が最新か判断できるように）
try { $('ver').textContent = REC_VERSION; } catch (e) {}

dbOpen().then(function() {
  return dbGetAll();
}).then(function(rows) {
  if (rows && rows.length) {
    // 前回の未送信音声が残っている → pending に復元し、連番を続きから採番する
    var maxIdx = -1;
    rows.forEach(function(r) {
      if (typeof r.index === 'number') {
        var sidx = (typeof r.sidx === 'number') ? r.sidx : r.index;
        pending[r.index] = { base64: r.base64, index: sidx, mime: r.mime || '' };
        if (r.mime && !recMime) recMime = r.mime;
        if (sidx > maxIdx) maxIdx = sidx;
      }
    });
    chunkIndex = maxIdx + 1;
    sentCount = 0;
    showWarn('前回の未送信の音声が ' + rows.length + ' 分ぶん残っています。'
           + 'カルテ画面(🎙 を開いたタブ)を開き直すと自動で送信されます。'
           + 'すぐ送るには「🔄 もう一度送信する」を押してください。');
    $('resendBtn').style.display = 'block';
  }
  sendReady();
}).catch(function() {
  sendReady();
});
</script>
